name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RCODE_REQUIRE_TLS_TEST: ${{ matrix.os != 'windows-latest' && '1' || '0' }}
      RCODE_REQUIRE_PTY_TEST: ${{ matrix.os != 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - run: python3 tests/eval_security.py
        if: runner.os != 'Windows'
  eval-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build --file evals/Dockerfile --tag rcode-eval-runtime evals
      - name: Configure local protected runtime
        run: |
          echo "RCODE_EVAL_IMAGE=$(docker image inspect rcode-eval-runtime --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "RCODE_EVAL_DOCKER=$(command -v docker)" >> "$GITHUB_ENV"
          echo "RCODE_EVAL_SOCKET=/var/run/docker.sock" >> "$GITHUB_ENV"
      - run: python3 evals/runtime/runtime_http.py
      - run: python3 tests/eval_runtime.py
      - run: python3 tests/eval_policy.py
      - run: python3 tests/eval_host.py
      - run: python3 tests/eval_controls.py
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
