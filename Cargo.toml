[package]
name = "rcode-cli"
version = "0.6.2"
edition = "2024"
rust-version = "1.88"
description = "Терминальный агент для разработки с Yandex AI Studio, GigaChat и OpenRouter"
license = "MIT"
repository = "https://github.com/adw0rd/rcode"
homepage = "https://github.com/adw0rd/rcode"
readme = "README.md"
keywords = ["cli", "coding-agent", "gigachat", "yandexgpt", "llm"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[lib]
name = "rcode"
path = "src/lib.rs"

[[bin]]
name = "rcode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4"
# Level-triggered TTY polling preserves simultaneous SIGWINCH and paste on macOS.
crossterm = { version = "0.29", features = ["use-dev-tty", "osc52"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures-util = "0.3"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rpassword = "7"
rustyline = "17.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
pulldown-cmark = { version = "0.13.5", default-features = false }

[profile.release]
lto = "thin"
strip = true
