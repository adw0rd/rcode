[package]
name = "rcode"
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
description = "Терминальный агент для разработки с Yandex AI Studio, GigaChat и OpenRouter"
license = "MIT"

[dependencies]
anyhow = "1"
cap-std = "4"
# Level-triggered TTY polling preserves simultaneous SIGWINCH and paste on macOS.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rpassword = "7"
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
